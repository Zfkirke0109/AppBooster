name: Android runtime tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android-runtime:
    name: Instrumented tests (Android 17 / API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install build SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run tests on Android 17
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          # avdmanager's generic device used a 64 MiB heap and never booted API 37.
          # Use an explicit phone profile and memory budget for the modern image.
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          # API 37 Google services fill the generic userdata partition before APK install.
          disk-size: 8192M
          # Let current emulators select Lavapipe for modern Vulkan support.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on -logcat '*:E'
          disable-animations: true
          pre-emulator-launch-script: |
            adb start-server
            emulator -accel-check
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb shell df -h /data
            ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-17-runtime-test-report
          retention-days: 14
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
