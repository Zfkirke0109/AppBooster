name: Android CI

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ───────────────────────────────────────────────────────────────
  # 1. Secret scan  –  fail before builds if signing material is tracked
  # ───────────────────────────────────────────────────────────────
  secret-scan:
    name: Signing secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reject committed signing files or values
        shell: bash
        run: |
          set -euo pipefail

          blocked_files=$(git ls-files | grep -Ei '(^|/)(local\.properties|signing\.properties|keystore\.properties|release-signing\.properties|gradle-local\.properties|.*\.local\.gradle\.properties)$|(\.(p12|jks|keystore|pfx|bks|pem|pk8|x509\.pem)$)' || true)
          if [ -n "$blocked_files" ]; then
            echo "::error::Signing material or local property files are tracked:"
            echo "$blocked_files"
            exit 1
          fi

          if git grep -nE '^[[:space:]]*(ghRelease(KeystorePath|KeyAlias|KeyPassword|StorePassword)|GH_RELEASE_(KEYSTORE_BASE64|KEYSTORE_PATH|KEY_ALIAS|KEY_PASSWORD|STORE_PASSWORD)|storePassword|keyPassword)[[:space:]]*=' -- . ':!README.md' ':!.github/workflows/android-ci.yml' ':!app/build.gradle.kts'; then
            echo "::error::Tracked file contains a signing secret assignment."
            exit 1
          fi

          if git grep -nE "(storePassword|keyPassword|releaseStorePassword|releaseKeyPassword)[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" -- '*.kt' '*.kts'; then
            echo "::error::Tracked Kotlin/Gradle file appears to hard-code a signing password."
            exit 1
          fi

          if git grep -nE -e '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|-----BEGIN PKCS12-----' -- . ':!README.md' ':!.github/workflows/android-ci.yml'; then
            echo "::error::Tracked file appears to contain private key material."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────
  # 2. Unit tests  –  must pass before release packaging
  # ───────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests (runUnitTests)
        run: ./gradlew --no-daemon runUnitTests

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          retention-days: 14
          path: app/build/reports/tests/testDebugUnitTest/**

  # ───────────────────────────────────────────────────────────────
  # 3. Signed release build  –  pushes to mainline branches and v* tags
  # ───────────────────────────────────────────────────────────────
  signed-release:
    name: Signed release build
    runs-on: ubuntu-latest
    needs: [secret-scan, unit-tests]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    timeout-minutes: 45

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read version from build config
        id: version
        run: |
          # Extract major, minor, patch variables from build.gradle.kts
          major=$(grep -oP 'val major\s*=\s*\K\d+' app/build.gradle.kts)
          minor=$(grep -oP 'val minor\s*=\s*\K\d+' app/build.gradle.kts)
          patch=$(grep -oP 'val patch\s*=\s*\K\d+' app/build.gradle.kts)
          version_name="${major}.${minor}.${patch}"
          version_code=$(( major * 10000 + minor * 100 + patch ))
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "### Version info" >> "$GITHUB_STEP_SUMMARY"
          echo "- **versionName**: ${version_name}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **versionCode**: ${version_code}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare signing keystore
        env:
          GH_RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GH_RELEASE_KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          GH_RELEASE_KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
          GH_RELEASE_STORE_PASSWORD:  ${{ secrets.KEYSTORE_PASSWORD }}
          EXPECTED_SIGNER_SHA256:     ${{ secrets.EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          for secret in GH_RELEASE_KEYSTORE_BASE64 GH_RELEASE_KEY_ALIAS GH_RELEASE_KEY_PASSWORD GH_RELEASE_STORE_PASSWORD EXPECTED_SIGNER_SHA256; do
            if [ -z "${!secret}" ]; then
              echo "::error::Required secret $secret is not configured."
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/rootlesszachdsp.jks"
          printf '%s' "$GH_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass "$GH_RELEASE_STORE_PASSWORD" -alias "$GH_RELEASE_KEY_ALIAS" >/dev/null
          actual_fingerprint="$(keytool -exportcert -keystore "$keystore_path" -storepass "$GH_RELEASE_STORE_PASSWORD" -alias "$GH_RELEASE_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          expected_fingerprint="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          test "$actual_fingerprint" = "$expected_fingerprint" || { echo "::error::Signing certificate fingerprint mismatch."; exit 1; }

          {
            echo "GH_RELEASE_KEYSTORE_PATH=$keystore_path"
            echo "GH_RELEASE_KEY_ALIAS=$GH_RELEASE_KEY_ALIAS"
            echo "GH_RELEASE_KEY_PASSWORD=$GH_RELEASE_KEY_PASSWORD"
            echo "GH_RELEASE_STORE_PASSWORD=$GH_RELEASE_STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble signed release APK & AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify release APK signature
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in Android build-tools."
            exit 1
          fi

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            report="$RUNNER_TEMP/$(basename "$apk").apksigner.txt"
            "$apksigner" verify --verbose --print-certs "$apk" | tee "$report"
            actual="$(awk -F': ' '/certificate SHA-256 digest:/ {print toupper($2); exit}' "$report" | tr -d '[:space:]:' )"
            expected="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
            test "$actual" = "$expected" || { echo "::error::Signed APK certificate mismatch."; exit 1; }
          done

      - name: Remove signing material from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/rootlesszachdsp.jks"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

  # ───────────────────────────────────────────────────────────────
  # 4. Publish GitHub Release  –  v* tags only
  # ───────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: signed-release
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write          # required to create GitHub Releases
      pull-requests: read      # required to read PR body for changelog

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # required for previous-tag release notes

      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-release-artifacts
          path: release-artifacts

      - name: Generate release notes
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          if [ -n "$previous_tag" ]; then
            pr_body=$(git log --pretty=format:'- %s' "${previous_tag}..${{ github.sha }}")
          else
            pr_body=$(git log --pretty=format:'- %s' -20 "${{ github.sha }}")
          fi

          {
            echo "body<<CHANGELOG_EOF"
            echo "$pr_body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          tag="${{ github.ref_name }}"
          files=$(find release-artifacts -type f \( -name '*.apk' -o -name '*.aab' \))

          gh release create "$tag" \
            --title "Galaxy OptiDroid $tag" \
            --notes "$RELEASE_BODY" \
            --target "${{ github.sha }}" \
            $files

