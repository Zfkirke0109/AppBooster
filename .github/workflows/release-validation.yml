name: ART compiler release validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: ART compiler unit tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run ART result and Binder safety tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests '*DexoptStatusParserTest' \
            --tests '*ShellServiceOutputPolicyTest'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: art-compiler-test-report
          retention-days: 14
          path: app/build/reports/tests/testDebugUnitTest/**

  signed-release:
    name: Signed release and identity manifest
    if: github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Prepare signing keystore
        env:
          GH_RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GH_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GH_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EXPECTED_SIGNER_SHA256: ${{ secrets.EXPECTED_SIGNER_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for secret in GH_RELEASE_KEYSTORE_BASE64 GH_RELEASE_KEY_ALIAS GH_RELEASE_KEY_PASSWORD GH_RELEASE_STORE_PASSWORD EXPECTED_SIGNER_SHA256; do
            if [ -z "${!secret}" ]; then
              echo "::error::Required secret $secret is not configured."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/galaxy-optidroid-release.jks"
          printf '%s' "$GH_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            echo "GH_RELEASE_KEYSTORE_PATH=$keystore"
            echo "GH_RELEASE_KEY_ALIAS=$GH_RELEASE_KEY_ALIAS"
            echo "GH_RELEASE_KEY_PASSWORD=$GH_RELEASE_KEY_PASSWORD"
            echo "GH_RELEASE_STORE_PASSWORD=$GH_RELEASE_STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature and write SHA-256 manifest
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.EXPECTED_SIGNER_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          test -n "$apk" || { echo "::error::release APK not found"; exit 1; }

          report="$RUNNER_TEMP/apksigner-report.txt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$report"
          signer="$(awk '/certificate SHA-256 digest:/ {print toupper($NF); exit}' "$report" | tr -d '[:space:]:' )"
          expected="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          test "$signer" = "$expected" || { echo "::error::Signing certificate fingerprint mismatch"; exit 1; }

          apk_sha="$(sha256sum "$apk" | awk '{print toupper($1)}')"
          manifest="$RUNNER_TEMP/release-validation-manifest.txt"
          {
            echo "commit=${GITHUB_SHA}"
            echo "apk=$(basename "$apk")"
            echo "apk_sha256=$apk_sha"
            echo "signer_cert_sha256=$signer"
          } | tee "$manifest"
          cp "$manifest" app/build/outputs/apk/release/release-validation-manifest.txt
          {
            echo "### Signed release validation"
            echo "- APK SHA-256: \`$apk_sha\`"
            echo "- Signer certificate SHA-256: \`$signer\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/galaxy-optidroid-release.jks"

      - name: Upload signed release and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: art-compiler-signed-release
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/release-validation-manifest.txt
